# Render Blueprint — Portfolio CMS
# Prefer Static Site (no Node process). If you already created a Web Service,
# use buildCommand + startCommand below with runtime: node instead.
services:
  - type: web
    name: portfolio-cms
    runtime: static
    plan: free
    branch: main
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
