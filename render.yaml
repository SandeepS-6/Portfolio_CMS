# Render Blueprint — Portfolio CMS (static SPA)
services:
  - type: web
    name: portfolio-cms
    runtime: static
    plan: free
    branch: main
    # Install is inside package.json "build" so a plain `npm run build` works on Render.
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
